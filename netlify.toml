[build]
  base = ""
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/assets/**"]

[build.environment]
  NODE_VERSION = "20"

[[context.deploy-preview.plugins]]
  package = "@netlify/plugin-lighthouse"

# Explicit redirects for API endpoints to Netlify Functions
# These MUST come before the SPA wildcard redirect
[[redirects]]
  from = "/api/contact-email"
  to = "/.netlify/functions/send-contact-email"
  status = 200

[[redirects]]
  from = "/api/client-registration-email"
  to = "/.netlify/functions/client-registration-email"
  status = 200
  force = true

[[redirects]]
  from = "/api/client-registration-email/*"
  to = "/.netlify/functions/client-registration-email/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/instagram"
  to = "/.netlify/functions/instagram-feed"
  status = 200

[[redirects]]
  from = "/api/test-email"
  to = "/.netlify/functions/test-email"
  status = 200

[[redirects]]
  from = "/api/submit-order"
  to = "/.netlify/functions/submit-order"
  status = 200

[[redirects]]
  from = "/api/admin-client-invite"
  to = "/.netlify/functions/admin-client-invite"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-client-registrations"
  to = "/.netlify/functions/admin-client-registrations"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-client-registrations-backfill"
  to = "/.netlify/functions/admin-client-registrations-backfill"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-b2b-orders"
  to = "/.netlify/functions/admin-b2b-orders"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-create-admin"
  to = "/.netlify/functions/admin-create-admin"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-client-access-reset"
  to = "/.netlify/functions/admin-client-access-reset"
  status = 200
  force = true

# Static HTML page redirects
[[redirects]]
  from = "/thank-you-compliance-consultation"
  to = "/thank-you-compliance-consultation.html"
  status = 200

# Seasonal Valentine's page redirect
[[redirects]]
  from = "/seasonal/valentines"
  to = "/seasonal/valentines/index.html"
  status = 200

[[redirects]]
  from = "/seasonal/valentines/"
  to = "/seasonal/valentines/index.html"
  status = 200

# SPA redirect - serve index.html for all other routes
# This must be LAST so explicit redirects and functions take precedence
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache headers for factory video files
[[headers]]
  for = "/videos/factory videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache headers for static assets (JS, CSS, fonts, images in /assets/)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache headers for Instagram placeholder images (30 days)
[[headers]]
  for = "/img/instagram/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Cache headers for seasonal Valentine's assets
[[headers]]
  for = "/seasonal/valentines/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Cache headers for seasonal styles
[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
