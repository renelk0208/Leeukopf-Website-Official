[build]
  base = ""
  command = "npm run build"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

[[edge_functions]]
  path = "/*"
  function = "bot-protection"

[build.processing]
  skip_processing = false

[build.processing.images]
  compress = true

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/assets/**"]

[build.environment]
  NODE_VERSION = "20"
  # Netlify's install step defaults NODE_ENV=production, which skips devDependencies
  # (sharp, vite, typescript, etc. are required by prebuild/build scripts).
  NPM_FLAGS = "--include=dev"

# Cache images and static assets for 1 year
[[headers]]
  for = "/gelitup-content/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects are authored in scripts/netlify-redirects.config.cjs and generated into
# public/_redirects during predev/prebuild. Keep netlify.toml focused on build,
# functions, edge functions, and headers to avoid redirect drift between sources.

# Cache headers for factory video files
[[headers]]
  for = "/videos/factory videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache headers for static assets (JS, CSS, fonts, images in /assets/)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache headers for Instagram placeholder images (30 days)
[[headers]]
  for = "/img/instagram/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Cache headers for seasonal Valentine's assets
[[headers]]
  for = "/seasonal/valentines/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Cache headers for seasonal styles
[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
