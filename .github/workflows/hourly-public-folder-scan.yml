name: Hourly Public Folder Scan

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scan-public-folder:
    name: Scan full public folder integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inventory tracked public files
        run: |
          FILE_COUNT=$(git ls-files public | wc -l)
          echo "Tracked files under public/: ${FILE_COUNT}"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "No tracked files found in public/. Failing scan."
            exit 1
          fi

      - name: Run full image/category checks
        run: |
          npm run check:images
          npm run validate:b2b-categories
          npm run validate:b2b-image-quality
          npm run validate:b2b-subcategory-routes
          npm run validate:b2b-order-flow

      - name: Ensure validators do not mutate public/
        run: |
          if ! git diff --quiet -- public; then
            echo "Validation scripts changed files in public/."
            echo "Diff:"
            git --no-pager diff -- public
            exit 1
          fi
