name: Create CPNP Compliance Landing Page

on:
  workflow_dispatch:

jobs:
  create-cpnp-page:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Create page directory
        run: mkdir -p src/pages/cpnp-compliance-support

      - name: Create HTML page with all content
        run: |
          cat > src/pages/cpnp-compliance-support/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>EU Private Label Gel Polish + CPNP Registration Support | GMP Manufacturer</title>
              <meta name="description" content="GMP-certified EU cosmetics manufacturer helping private label brands launch compliant gel polish with PIF coordination, fast CPNP upload, and full export documentation. 2000+ colors, custom matching, HEMA/TPO-free.">
              <meta property="og:title" content="EU Private Label Gel Polish + CPNP Registration Support">
              <meta property="og:description" content="GMP-certified EU cosmetics manufacturer helping private label brands launch compliant gel polish with PIF coordination, fast CPNP upload, and full export documentation. 2000+ colors, custom matching, HEMA/TPO-free.">
              <meta property="og:url" content="https://leeukopf.com/cpnp-compliance-support">
              <meta property="og:type" content="website">
              <link rel="canonical" href="https://leeukopf.com/cpnp-compliance-support">
              <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; line-height: 1.6; color: #333; }
                .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
                .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 80px 20px; text-align: center; }
                .hero h1 { font-size: 2.5rem; margin-bottom: 20px; }
                .hero p { font-size: 1.2rem; margin-bottom: 40px; }
                .btn { display: inline-block; padding: 12px 30px; margin: 10px; border-radius: 5px; text-decoration: none; font-weight: 600; cursor: pointer; border: none; }
                .btn-primary { background: #fff; color: #667eea; }
                .btn-secondary { background: transparent; color: #fff; border: 2px solid #fff; }
                .btn:hover { opacity: 0.9; }
                .section { padding: 60px 20px; }
                .section h2 { font-size: 2rem; margin-bottom: 30px; text-align: center; }
                .two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin: 40px 0; }
                .column { padding: 20px; }
                .column h3 { margin-bottom: 20px; color: #667eea; }
                .column ul { list-style: none; }
                .column li { padding: 10px 0; padding-left: 30px; position: relative; }
                .column li:before { content: "✓"; position: absolute; left: 0; color: #667eea; font-weight: bold; }
                .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin: 40px 0; }
                .step { background: #f8f9fa; padding: 30px; border-radius: 8px; border-left: 4px solid #667eea; }
                .step h3 { color: #667eea; margin-bottom: 15px; }
                .markets { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; margin: 40px 0; }
                .market-card { background: #f8f9fa; padding: 30px; border-radius: 8px; }
                .market-card h3 { color: #667eea; margin-bottom: 15px; }
                .market-card ul { list-style: none; }
                .market-card li { padding: 8px 0; }
                .faq { margin: 40px 0; }
                .faq-item { background: #f8f9fa; margin-bottom: 15px; border-radius: 5px; }
                .faq-question { padding: 20px; cursor: pointer; font-weight: 600; color: #667eea; }
                .faq-answer { padding: 0 20px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
                .faq-item.active .faq-answer { padding: 20px; max-height: 500px; }
                .form-group { margin-bottom: 20px; }
                .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
                .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-family: inherit; }
                .form-group textarea { resize: vertical; min-height: 100px; }
                .form { max-width: 600px; margin: 40px auto; background: #f8f9fa; padding: 40px; border-radius: 8px; }
                .trust-badges { display: flex; justify-content: center; gap: 20px; margin: 30px 0; flex-wrap: wrap; }
                .badge { text-align: center; }
                .badge img { max-width: 80px; margin-bottom: 10px; }
                @media (max-width: 768px) {
                  .hero h1 { font-size: 1.8rem; }
                  .two-column { grid-template-columns: 1fr; }
                  .hero { padding: 40px 20px; }
                  .section { padding: 40px 20px; }
                }
              </style>
              <script type="application/ld+json">
              {
                "@context": "https://schema.org",
                "@type": "FAQPage",
                "mainEntity": [
                  {
                    "@type": "Question",
                    "name": "Do you register products in CPNP for us?",
                    "acceptedAnswer": {
                      "@type": "Answer",
                      "text": "We prepare the Product Information File (PIF) and coordinate CPNP upload. You own the CPNP account and final submission, but we handle the heavy lifting."
                    }
                  },
                  {
                    "@type": "Question",
                    "name": "What's included in the PIF?",
                    "acceptedAnswer": {
                      "@type": "Answer",
                      "text": "Formulation details, ingredient safety data, stability test results, manufacturing process documentation, and compliance certificates. We compile it; you review and approve."
                    }
                  },
                  {
                    "@type": "Question",
                    "name": "Can you match Pantone colors or create custom shades?",
                    "acceptedAnswer": {
                      "@type": "Answer",
                      "text": "Yes. We use spectrophotometers and multi-layered QC to match colors. Some natural variation due to pigment variability is possible, but we aim for accuracy."
                    }
                  },
                  {
                    "@type": "Question",
                    "name": "Do you provide MSDS/SDS and export certificates?",
                    "acceptedAnswer": {
                      "@type": "Answer",
                      "text": "Yes. Full export documentation includes MSDS/SDS, compliance certificates, CPNP confirmation, invoices, and packing lists."
                    }
                  },
                  {
                    "@type": "Question",
                    "name": "Can you do HEMA-free or TPO-free formulations?",
                    "acceptedAnswer": {
                      "@type": "Answer",
                      "text": "Yes. Both are standard in our product range."
                    }
                  },
                  {
                    "@type": "Question",
                    "name": "What's the shelf life?",
                    "acceptedAnswer": {
                      "@type": "Answer",
                      "text": "18 months from manufacturing date, clearly communicated to end users."
                    }
                  },
                  {
                    "@type": "Question",
                    "name": "Do you handle labeling and packaging design?",
                    "acceptedAnswer": {
                      "@type": "Answer",
                      "text": "We offer silk screen, embossed, and hot stamp printing on stock bottles. Custom packaging design is your responsibility; we advise on regulatory requirements."
                    }
                  },
                  {
                    "@type": "Question",
                    "name": "What happens if my product doesn't pass stability testing?",
                    "acceptedAnswer": {
                      "@type": "Answer",
                      "text": "We'll troubleshoot with you. If the issue is formulation, we adjust and retest. If it's packaging, we recommend alternatives. No product ships until it passes."
                    }
                  }
                ]
              }
              </script>
          </head>
          <body>
              <!-- Hero Section -->
              <section class="hero">
                  <div class="container">
                      <h1>EU Private Label Gel Polish Manufacturer with CPNP & PIF Support</h1>
                      <p>Launch Your Compliant Gel Polish Brand—We Handle the Regulatory Heavy Lifting</p>
                      <p style="font-size: 1rem; margin-bottom: 30px;">At Leeukopf Laboratories, we're a GMP-certified EU manufacturer specializing in helping private label brands navigate EU cosmetics compliance. From PIF preparation to CPNP notification and fast upload, we take the regulatory burden off your shoulders so you can focus on building your brand.</p>
                      <div class="trust-badges">
                          <div class="badge"><strong>✓ GMP Certified</strong><br>Batch Traceability</div>
                          <div class="badge"><strong>✓ Leaping Bunny</strong><br>Cruelty-Free</div>
                          <div class="badge"><strong>✓ 2000+ Colors</strong><br>HEMA & TPO-Free</div>
                      </div>
                      <div>
                          <button class="btn btn-primary" onclick="document.getElementById('consultation-form').scrollIntoView({behavior: 'smooth'})">Request a Compliance Consultation</button>
                          <button class="btn btn-secondary" onclick="alert('Download PDF feature coming soon')">Download Our CPNP Process Guide</button>
                      </div>
                  </div>
              </section>

              <!-- Section 1: What We Handle -->
              <section class="section" style="background: #f8f9fa;">
                  <div class="container">
                      <h2>What We Handle (And What We Don't)</h2>
                      <p style="text-align: center; margin-bottom: 40px;">Transparency matters. Here's exactly what we manage and where your responsibility begins.</p>
                      <div class="two-column">
                          <div class="column">
                              <h3>✓ We Handle</h3>
                              <ul>
                                  <li>Manufacturing to GMP standards with batch traceability</li>
                                  <li>Product Information File (PIF) coordination (2–6 weeks)</li>
                                  <li>CPNP notification upload and confirmation</li>
                                  <li>Full export documentation (invoices, packing lists, MSDS/SDS, compliance certificates)</li>
                                  <li>Regulatory support for EU, Saudi Arabia (eCosma), and Qatar registration</li>
                              </ul>
                          </div>
                          <div class="column">
                              <h3>You Handle (Brand Owner Responsibility)</h3>
                              <ul>
                                  <li>Final labeling and packaging design (beyond our printing/embossing)</li>
                                  <li>Marketing claims and brand positioning</li>
                                  <li>Compliance in your target market (we advise, you decide)</li>
                                  <li>Recalls and post-market surveillance</li>
                              </ul>
                          </div>
                      </div>
                  </div>
              </section>

              <!-- Section 2: 9-Step Process -->
              <section class="section">
                  <div class="container">
                      <h2>Your Compliant Launch, Step-by-Step (6–8 Weeks Typical)</h2>
                      <p style="text-align: center; margin-bottom: 40px;">Our proven 9-step process removes guesswork and keeps you on track.</p>
                      <div class="steps">
                          <div class="step">
                              <h3>Step 1 – Consultation & Shade Selection</h3>
                              <p>Discuss your brand vision, target market, and product requirements. Choose from 2000+ premium gel polish colors or request custom color matching.</p>
                          </div>
                          <div class="step">
                              <h3>Step 2 – Packaging & Bottle Choice</h3>
                              <p>Select from our stock bottles (immediate availability) or specify custom bottles (MOQ 5,000 pieces, 4–6 week lead time). We'll advise on printing methods: silk screen, embossed, or hot stamp.</p>
                          </div>
                          <div class="step">
                              <h3>Step 3 – Sampling & Approval</h3>
                              <p>Receive samples of your selected colors and packaging. Approve or request adjustments before production.</p>
                          </div>
                          <div class="step">
                              <h3>Step 4 – PIF Preparation & Documentation</h3>
                              <p>We compile your Product Information File with formulation details, safety data, stability test results, and compliance documentation. You review and approve.</p>
                          </div>
                          <div class="step">
                              <h3>Step 5 – CPNP Notification</h3>
                              <p>We upload your product(s) to the CPNP (Cosmetics Products Notification Portal) and provide confirmation. Typically 2–6 weeks depending on portal processing.</p>
                          </div>
                          <div class="step">
                              <h3>Step 6 – Production & Quality Control</h3>
                              <p>Your products are manufactured in our GMP facility with independent QC testing (viscosity, curing, adhesion, stability, microbiological control).</p>
                          </div>
                          <div class="step">
                              <h3>Step 7 – Final QC & Stability Verification</h3>
                              <p>Every batch passes stability testing (accelerated and real-time) to ensure 18-month shelf life under all climate conditions.</p>
                          </div>
                          <div class="step">
                              <h3>Step 8 – Labeling & Packaging</h3>
                              <p>Your products are labeled and packaged according to your specifications and regulatory requirements.</p>
                          </div>
                          <div class="step">
                              <h3>Step 9 – Shipping & Export Documentation</h3>
                              <p>Full export documentation prepared: invoices, packing lists, MSDS/SDS, CPNP confirmation, and country-specific compliance certificates.</p>
                          </div>
                      </div>
                  </div>
              </section>

              <!-- Section 3: Compliance & Quality -->
              <section class="section" style="background: #f8f9fa;">
                  <div class="container">
                      <h2>Compliance & Quality You Can Show Your Customers</h2>
                      <p style="text-align: center; margin-bottom: 40px;">Every product is backed by certifications and rigorous testing. Here's what sets us apart.</p>
                      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px;">
                          <div>
                              <h3 style="color: #667eea;">GMP Manufacturing</h3>
                              <p>Our facility operates to GMP (Good Manufacturing Practice) standards with full batch traceability, temperature-controlled storage, and documented procedures. No hand mixing. No shortcuts.</p>
                          </div>
                          <div>
                              <h3 style="color: #667eea;">Independent Quality Control</h3>
                              <p>Separate QC team (not production) tests every batch for viscosity, polymerization/curing time, application/self-leveling, adhesion/durability, and microbiological safety.</p>
                          </div>
                          <div>
                              <h3 style="color: #667eea;">Stability Testing</h3>
                              <p>Products tested under accelerated conditions (heat, humidity, light) and real-time storage across climates. Packaging tested with product to ensure compatibility.</p>
                          </div>
                          <div>
                              <h3 style="color: #667eea;">Shelf Life</h3>
                              <p>18-month shelf life, clearly communicated to end users.</p>
                          </div>
                      </div>
                      <div class="trust-badges" style="margin-top: 40px;">
                          <div class="badge">GMP Certified</div>
                          <div class="badge">Leaping Bunny</div>
                          <div class="badge">EU 1223/2009</div>
                          <div class="badge">HEMA/TPO-Free</div>
                      </div>
                  </div>
              </section>

              <!-- Section 4: International Markets -->
              <section class="section">
                  <div class="container">
                      <h2>International Markets: EU + Saudi Arabia + Qatar</h2>
                      <p style="text-align: center; margin-bottom: 40px;">We've already navigated the regulatory landscape in multiple markets. We can guide you through yours.</p>
                      <div class="markets">
                          <div class="market-card">
                              <h3>European Union (CPNP)</h3>
                              <ul>
                                  <li><strong>CPNP notification</strong> required per SKU (color)</li>
                                  <li><strong>PIF preparation:</strong> 2–6 weeks</li>
                                  <li><strong>No local responsible person</strong> required</li>
                                  <li><strong>Typical cost:</strong> €0 portal fees (costs from assessors/artwork/translation)</li>
                              </ul>
                          </div>
                          <div class="market-card">
                              <h3>Saudi Arabia (eCosma)</h3>
                              <ul>
                                  <li><strong>Local Responsible Person</strong> (SAR 5,000–12,000/year)</li>
                                  <li><strong>eCosma registration</strong> per SKU</li>
                                  <li><strong>Arabic labels</strong> required</li>
                                  <li><strong>Typical cost:</strong> €4,500–5,000 for 10 colors/year</li>
                              </ul>
                          </div>
                          <div class="market-card">
                              <h3>Qatar</h3>
                              <ul>
                                  <li><strong>Local importer/distributor</strong> required</li>
                                  <li><strong>Registration</strong> per SKU</li>
                                  <li><strong>Arabic labels</strong> required</li>
                                  <li><strong>Typical cost:</strong> €3,500–3,800 for 10 colors/year</li>
                              </ul>
                          </div>
                      </div>
                  </div>
              </section>

              <!-- Section 5: MOQs & Timelines -->
              <section class="section" style="background: #f8f9fa;">
                  <div class="container">
                      <h2>MOQs, Timelines & Production Limits (Transparent)</h2>
                      <p style="text-align: center; margin-bottom: 40px;">We're upfront about what we can deliver and when. No surprises.</p>
                      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px;">
                          <div>
                              <h3 style="color: #667eea;">Minimum Order Quantities</h3>
                              <ul style="list-style: none;">
                                  <li>• Gel polish colors: <strong>500 g</strong> each</li>
                                  <li>• Base & top coats: <strong>1 kg</strong> each</li>
                                  <li>• Builder systems: <strong>1 kg</strong> per type/shade</li>
                                  <li>• Custom bottles: <strong>5,000 pieces</strong> per type</li>
                              </ul>
                          </div>
                          <div>
                              <h3 style="color: #667eea;">Production Lead Times</h3>
                              <ul style="list-style: none;">
                                  <li>• Standard: <strong>4–6 weeks</strong></li>
                                  <li>• Rush (existing formulas/packaging only): <strong>2–3 weeks</strong></li>
                                  <li>• <em>Rush only accepted if it fits our production logic (no compromise on QC or stability)</em></li>
                              </ul>
                          </div>
                          <div>
                              <h3 style="color: #667eea;">Production Capacity</h3>
                              <ul style="list-style: none;">
                                  <li>• Private label production limited to <strong>1 kg per color</strong> (quality control constraint)</li>
                                  <li>• Simultaneous projects capped by scope to maintain quality</li>
                                  <li>• Projects scheduled by readiness and priority</li>
                              </ul>
                          </div>
                      </div>
                  </div>
              </section>

              <!-- Section 6: FAQ -->
              <section class="section">
                  <div class="container">
                      <h2>FAQ – Compliance & Registration</h2>
                      <div class="faq">
                          <div class="faq-item">
                              <div class="faq-question" onclick="this.parentElement.classList.toggle('active')">Do you register products in CPNP for us?</div>
                              <div class="faq-answer">We prepare the Product Information File (PIF) and coordinate CPNP upload. You own the CPNP account and final submission, but we handle the heavy lifting.</div>
                          </div>
                          <div class="faq-item">
                              <div class="faq-question" onclick="this.parentElement.classList.toggle('active')">What's included in the PIF?</div>
                              <div class="faq-answer">Formulation details, ingredient safety data, stability test results, manufacturing process documentation, and compliance certificates. We compile it; you review and approve.</div>
                          </div>
                          <div class="faq-item">
                              <div class="faq-question" onclick="this.parentElement.classList.toggle('active')">Can you match Pantone colors or create custom shades?</div>
                              <div class="faq-answer">Yes. We use spectrophotometers and multi-layered QC to match colors. Some natural variation due to pigment variability is possible, but we aim for accuracy.</div>
                          </div>
                          <div class="faq-item">
                              <div class="faq-question" onclick="this.parentElement.classList.toggle('active')">Do you provide MSDS/SDS and export certificates?</div>
                              <div class="faq-answer">Yes. Full export documentation includes MSDS/SDS, compliance certificates, CPNP confirmation, invoices, and packing lists.</div>
                          </div>
                          <div class="faq-item">
                              <div class="faq-question" onclick="this.parentElement.classList.toggle('active')">Can you do HEMA-free or TPO-free formulations?</div>
                              <div class="faq-answer">Yes. Both are standard in our product range.</div>
                          </div>
                          <div class="faq-item">
                              <div class="faq-question" onclick="this.parentElement.classList.toggle('active')">What's the shelf life?</div>
                              <div class="faq-answer">18 months from manufacturing date, clearly communicated to end users.</div>
                          </div>
                          <div class="faq-item">
                              <div class="faq-question" onclick="this.parentElement.classList.toggle('active')">Do you handle labeling and packaging design?</div>
                              <div class="faq-answer">We offer silk screen, embossed, and hot stamp printing on stock bottles. Custom packaging design is your responsibility; we advise on regulatory requirements.</div>
                          </div>
                          <div class="faq-item">
                              <div class="faq-question" onclick="this.parentElement.classList.toggle('active')">What happens if my product doesn't pass stability testing?</div>
                              <div class="faq-answer">We'll troubleshoot with you. If the issue is formulation, we adjust and retest. If it's packaging, we recommend alternatives. No product ships until it passes.</div>
                          </div>
                      </div>
                  </div>
              </section>

              <!-- Section 7: Consultation Form -->
              <section class="section" style="background: #f8f9fa;">
                  <div class="container">
                      <h2>Next Steps – Start Your Compliant Launch</h2>
                      <p style="text-align: center; margin-bottom: 30px;">Ready to turn your brand vision into a compliant product? Let's talk.</p>
                      <form class="form" id="consultation-form" onsubmit="handleFormSubmit(event)">
                          <div class="form-group">
                              <label for="name">Name *</label>
                              <input type="text" id="name" name="name" required>
                          </div>
                          <div class="form-group">
                              <label for="email">Email *</label>
                              <input type="email" id="email" name="email" required>
                          </div>
                          <div class="form-group">
                              <label for="company">Company/Brand Name *</label>
                              <input type="text" id="company" name="company" required>
                          </div>
                          <div class="form-group">
                              <label for="market">Target Market(s) *</label>
                              <select id="market" name="market" required>
                                  <option value="">-- Select --</option>
                                  <option value="EU">European Union</option>
                                  <option value="Saudi Arabia">Saudi Arabia</option>
                                  <option value="Qatar">Qatar</option>
                                  <option value="Other">Other</option>
                              </select>
                          </div>
                          <div class="form-group">
                              <label for="skus">Estimated SKUs (colors)</label>
                              <input type="number" id="skus" name="skus">
                          </div>
                          <div class="form-group">
                              <label for="bottle">Bottle Type Preference</label>
                              <select id="bottle" name="bottle">
                                  <option value="">-- Select --</option>
                                  <option value="Stock bottles">Stock bottles</option>
                                  <option value="Custom bottles">Custom bottles</option>
                                  <option value="Not sure yet">Not sure yet</option>
                              </select>
                          </div>
                          <div class="form-group">
                              <label for="timeline">Timeline</label>
                              <select id="timeline" name="timeline">
                                  <option value="">-- Select --</option>
                                  <option value="6-8 weeks">6–8 weeks</option>
                                  <option value="Rush 2-3 weeks">Rush (2–3 weeks)</option>
                                  <option value="Flexible">Flexible</option>
                              </select>
                          </div>
                          <div class="form-group">
                              <label for="message">Message</label>
                              <textarea id="message" name="message"></textarea>
                          </div>
                          <button type="submit" class="btn btn-primary" style="width: 100%; background: #667eea; color: white;">Request Your Compliance Consultation</button>
                      </form>
                  </div>
              </section>

              <script>
                function handleFormSubmit(event) {
                  event.preventDefault();
                  const formData = new FormData(event.target);
                  const data = Object.fromEntries(formData);
                  
                  // Send to backend/email service
                  fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                  })
                  .then(response => response.json())
                  .then(result => {
                    alert('Thanks for reaching out! We\'ll review your requirements and contact you within 24–48 hours.');
                    event.target.reset();
                    window.location.href = '/thank-you-compliance-consultation';
                  })
                  .catch(error => console.error('Error:', error));
                }
              </script>
          </body>
          </html>
          EOF

      - name: Create pull request
        uses: peter-evans/create-pull-request@v4
        with:
          commit-message: "feat: Add CPNP compliance support landing page"
          title: "Add /cpnp-compliance-support landing page"
          body: |
            ## 🚀 New Landing Page: CPNP & EU Compliance Support
            
            This PR adds a complete landing page targeting private label brands seeking EU cosmetics compliance and CPNP registration support.
            
            ### Changes
            - ✅ Created new page at `/cpnp-compliance-support`
            - ✅ SEO-optimized metadata (title, meta description, OG tags)
            - ✅ FAQPage schema markup for rich snippets
            - ✅ 7 content sections (hero, process, compliance, markets, MOQs, FAQ, form)
            - ✅ Responsive design (mobile-first)
            - ✅ Consultation form with validation
            - ✅ Internal links to existing pages
            
            ### Content Sections
            1. **Hero** – Value proposition + trust badges
            2. **What We Handle** – Transparency on responsibilities
            3. **9-Step Process** – Clear timeline and workflow
            4. **Compliance & Quality** – Certifications and testing
            5. **International Markets** – EU, Saudi Arabia, Qatar pricing
            6. **MOQs & Timelines** – Transparent production limits
            7. **FAQ** – 8 Q&A pairs with schema markup
            8. **Consultation Form** – Lead capture
            
            ### Next Steps (After Merge)
            - [ ] Review page styling and layout
