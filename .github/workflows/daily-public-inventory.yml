name: Daily Public Folder Inventory

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  archive-public-inventory:
    name: Archive public file inventory
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Build public inventory report
        run: |
          mkdir -p artifacts
          REPORT="artifacts/public-inventory-$(date -u +%Y-%m-%d).tsv"
          echo -e "path\tsize_bytes\tgit_object_hash" > "$REPORT"

          while read -r mode type hash size path; do
            echo -e "${path}\t${size}\t${hash}" >> "$REPORT"
          done < <(git ls-tree -r --long HEAD -- public | sort)

          count=$(git ls-tree -r HEAD -- public | wc -l)
          echo "Generated inventory report: $REPORT (${count} files)"

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-inventory-${{ github.run_id }}
          path: artifacts/public-inventory-*.tsv
          retention-days: 30
          if-no-files-found: warn
